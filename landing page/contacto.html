<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - PadelPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1F5DA0;
            --gradient-start: #1A4F8A;
            --gradient-end: #2874C8;
            --white: #ffffff;
            --text-dark: #1a1a1a;
            --text-light: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: #f0f4f8;
            min-height: 100vh;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            padding: 10px 16px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: var(--primary);
            color: var(--white);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .contact-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 32px;
            text-align: center;
        }

        .contact-info {
            margin-bottom: 32px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 12px;
            margin-bottom: 16px;
            color: var(--white);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(26, 79, 138, 0.3);
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .contact-details {
            flex: 1;
        }

        .contact-label {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .contact-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .whatsapp-btn {
            background: #25D366 !important;
        }

        .whatsapp-btn:hover {
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4) !important;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 79, 138, 0.3);
        }

        @media (max-width: 768px) {
            .contact-card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        ← Volver
    </a>

    <div class="container">
        <div class="contact-card">
            <h1>Contacto</h1>

            <div class="contact-info">
                <a href="mailto:juaneloyortizlara@gmail.com" class="contact-item">
                    <div class="contact-icon">✉️</div>
                    <div class="contact-details">
                        <div class="contact-label">Email</div>
                        <div class="contact-value">juaneloyortizlara@gmail.com</div>
                    </div>
                </a>

                <a href="tel:689114220" class="contact-item">
                    <div class="contact-icon">📱</div>
                    <div class="contact-details">
                        <div class="contact-label">Teléfono</div>
                        <div class="contact-value">689 114 220</div>
                    </div>
                </a>

                <a href="https://wa.me/34689114220" class="contact-item whatsapp-btn" target="_blank">
                    <div class="contact-icon">💬</div>
                    <div class="contact-details">
                        <div class="contact-label">WhatsApp</div>
                        <div class="contact-value">Escríbenos</div>
                    </div>
                </a>
            </div>

            <div class="divider">o manda un mensaje</div>

            <h2 class="form-title">Formulario de contacto</h2>

            <form action="mailto:juaneloyortizlara@gmail.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Tu email" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="¿En qué podemos ayudarte?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar mensaje</button>
            </form>
        </div>
    </div>
</body>
</html>
